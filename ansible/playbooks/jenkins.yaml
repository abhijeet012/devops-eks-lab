
- name: Configure Jenkins Server
  hosts: jenkins
  become: true

  tasks: 
    - name: Update apt cache
      apt: 
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt: 
        name: 
          - fontconfig
          - openjdk-21-jre
          - git
          - curl
          - wget
          - unzip
        state: present

    - name: Add Jenkins repository key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Start and enable Jenkins
      service:
        name: jenkins
        state: started
        enabled: true 

    - name: Download AWS CLI v2
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: '0644'

    - name: Extract AWS CLI v2
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Install AWS CLI v2
      command: /tmp/aws/install --update

    - name: Verify AWS CLI v2
      command: /usr/local/bin/aws --version
      register: aws_version
      changed_when: false

    - name: Display AWS CLI version
      debug:
        var: aws_version.stdout

    - name: Doenload kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Download helm
      get_url: 
        url: https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
        dest: /tmp/helm.tar.gz
        mode: '0644'

    - name: Extract Helm archive
      unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Install Helm Binary
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        mode: '0755'

